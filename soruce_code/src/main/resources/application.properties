spring.application.name=e-commerce

spring.datasource.url=jdbc:mysql://${DB_IP}:${DB_PORT}/${DB_SchemaName}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:8}

logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.jpa.properties.hibernate.jdbc.batch_size = ${SPRING_JPA_BATCH_SIZE:30}

# reorder inserts to allow batching .. note: can cause bugs and sql generate not in same order you wrote in code
spring.jpa.properties.hibernate.order_inserts=true
# reorder update to allow batching .. note: can cause bugs and sql generate not in same order you wrote in code
spring.jpa.properties.hibernate.order_updates=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB