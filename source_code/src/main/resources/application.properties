spring.application.name=e-commerce

spring.datasource.url=jdbc:mysql://${DB_IP}:${DB_PORT}/${DB_SchemaName}?rewriteBatchedStatements=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:100}
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout= 10000
spring.datasource.hikari.keepalive-time=10000

logging.level.org.springframework=${SPRING_LOG_LEVEL:OFF}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# logging.level.org.springframework.transaction=TRACE
# logging.level.org.springframework.orm.jpa=DEBUG

# Log SQL statements executed by JdbcTemplate
logging.level.org.springframework.jdbc.core.JdbcTemplate=OFF

# Log prepared-statement parameter values
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.log_slow_query=100
spring.jpa.properties.hibernate.jdbc.batch_size = ${SPRING_JPA_BATCH_SIZE:1000}
spring.datasource.hikari.leak-detection-threshold=100
# reorder inserts to allow batching .. note: can cause bugs and sql generate not in same order you wrote in code
spring.jpa.properties.hibernate.order_inserts=true
# reorder update to allow batching .. note: can cause bugs and sql generate not in same order you wrote in code
spring.jpa.properties.hibernate.order_updates=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
snowflake.datacenterId = 1
snowflake.workerId = 1